    // 預渲染所有 16x16 精靈圖至離屏 Canvas（包含正向與水平翻轉版本）
    const spriteCache = {};

    function preRenderSprites() {
      for (const [name, matrix] of Object.entries(SPRITES)) {
        if (matrix.length !== 16) {
          console.warn(`Sprite ${name} 高度非 16 像素`);
        }

        const normalCanvas = document.createElement('canvas');
        normalCanvas.width = 16;
        normalCanvas.height = 16;
        const nCtx = normalCanvas.getContext('2d');

        const flipCanvas = document.createElement('canvas');
        flipCanvas.width = 16;
        flipCanvas.height = 16;
        const fCtx = flipCanvas.getContext('2d');

        for (let y = 0; y < 16; y++) {
          const row = matrix[y];
          for (let x = 0; x < 16; x++) {
            const ch = row[x];
            const color = PALETTE[ch];
            if (color) {
              nCtx.fillStyle = color;
              nCtx.fillRect(x, y, 1, 1);

              fCtx.fillStyle = color;
              fCtx.fillRect(15 - x, y, 1, 1);
            }
          }
        }

        spriteCache[name] = {
          normal: normalCanvas,
          flipped: flipCanvas
        };
      }
    }

    function drawSprite(name, x, y, flipX = false) {
      const entry = spriteCache[name];
      if (!entry) return;
      const drawX = Math.round(x);
      const drawY = Math.round(y);
      ctx.drawImage(flipX ? entry.flipped : entry.normal, drawX, drawY);
    }

    // ============================================================================
    // 2. Web Audio API 8-BIT 復古晶片音效合成器（無外部音檔依賴）
    // ============================================================================
    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        } catch (err) {
          // 忽略瀏覽器音訊自動播放限制
        }
      }

      playTone(freqStart, freqEnd, duration, type = 'square', gainVal = 0.08, delay = 0) {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, now);
        if (freqEnd !== freqStart) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + duration);
        }

        gain.gain.setValueAtTime(gainVal, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      jump() {
        this.playTone(190, 560, 0.14, 'square', 0.07);
      }

      poundCharge() {
        this.playTone(520, 780, 0.09, 'square', 0.06);
      }

      poundSlam() {
        this.playTone(220, 55, 0.18, 'sawtooth', 0.11);
      }

      boxHit() {
        this.playTone(320, 640, 0.08, 'square', 0.08);
        this.playTone(880, 1320, 0.16, 'triangle', 0.09, 0.06);
      }

      fish() {
        this.playTone(987, 987, 0.07, 'square', 0.07, 0);
        this.playTone(1318, 1318, 0.16, 'square', 0.07, 0.06);
      }

      stomp() {
        this.playTone(260, 110, 0.10, 'square', 0.09);
        this.playTone(440, 620, 0.09, 'triangle', 0.07, 0.05);
      }

      hurt() {
        this.playTone(320, 90, 0.25, 'sawtooth', 0.09);
      }

      win() {
        const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
        const times = [0, 0.1, 0.2, 0.3, 0.45, 0.58];
        notes.forEach((n, idx) => {
          this.playTone(n, n, 0.14, 'square', 0.08, times[idx]);
        });
      }

      gameOver() {
        const notes = [392.00, 349.23, 329.63, 261.63];
        notes.forEach((n, idx) => {
          this.playTone(n, n * 0.96, 0.22, 'triangle', 0.09, idx * 0.2);
        });
      }
    }

              y: wy,
              used: false,
              bumpOffset: 0
            });
          } else if (ch === 'F') {
            fishes.push({
              x: wx,
              y: wy,
              baseY: wy,
              vy: 0,
              popping: false,
              collected: false,
              phase: c * 0.6
            });
          } else if (ch === 'R') {
            rats.push({
              x: wx + 1,
              y: wy + 2,
              w: 14,
              h: 14,
              vx: -stage.ratSpeed,
              speed: stage.ratSpeed,
              vy: 0,
              alive: true,
              squishTimer: 0,
              animTimer: 0
            });
          } else if (ch === 'G') {
            goalZone = {
              x: wx - 8,
              y: wy - 16,
              w: 36,
              h: 32,
              flagX: wx - 4,
              flagY: wy - 16,
              custX: wx + 12,
              custY: wy
            };
          }
        }
      }

      respawnPlayer(true);
    }

    function respawnPlayer(isInitial = false) {
      player.x = isInitial ? 24 : Math.max(24, Math.floor(cameraX / TILE_SIZE) * TILE_SIZE + 24);
      // 尋找安全落腳高度，避免重生在深淵上方
      let safeCol = Math.floor((player.x + player.w / 2) / TILE_SIZE);
      let foundSolid = false;
      for (let offset = 0; offset < 12; offset++) {
        const checkCol = Math.max(1, Math.min(LEVEL_COLS - 2, safeCol - offset));
        for (let r = 0; r < LEVEL_ROWS; r++) {
          if (isSolidTile(tileGrid[r][checkCol])) {
            player.x = checkCol * TILE_SIZE + 2;
            player.y = (r - 1) * TILE_SIZE;
            foundSolid = true;
            break;
          }
        }
        if (foundSolid) break;
      }
      if (!foundSolid) {
        player.x = 24;
        player.y = 144;
      }

      player.vx = 0;
      player.vy = 0;
      player.facingRight = true;
      player.grounded = false;
      player.coyoteTimer = 0;
      player.jumpBufferTimer = 0;
      player.poundState = 'NONE';
      player.poundTimer = 0;
      player.invulnTimer = isInitial ? 0 : 90;
    }

    // ============================================================================
    // 6. 粒子與浮動得分文字特效
    // ============================================================================
    function spawnParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const speed = 0.8 + Math.random() * 1.8;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.2,
          life: 18 + Math.floor(Math.random() * 10),
          color,
          size: Math.random() > 0.5 ? 2 : 1
        });
      }
    }

    function spawnFloatingText(x, y, text, color = '#ffd60a') {
      floatingTexts.push({
        x,
        y,
        text,
        color,
        life: 36
      });
    }

    // ============================================================================
    // 7. X 軸與 Y 軸分離式 AABB 碰撞檢測
    // ============================================================================
    function isSolidTile(ch) {
      return ch === '#' || ch === 'B' || ch === '?' || ch === 'U';
    }

    function aabbOverlap(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function resolveMapCollisionX(entity) {
      const leftCol = Math.floor(entity.x / TILE_SIZE);
      const rightCol = Math.floor((entity.x + entity.w - 0.01) / TILE_SIZE);
      const topRow = Math.floor(entity.y / TILE_SIZE);
      const bottomRow = Math.floor((entity.y + entity.h - 0.01) / TILE_SIZE);

      for (let r = topRow; r <= bottomRow; r++) {
        if (r < 0 || r >= LEVEL_ROWS) continue;
        for (let c = leftCol; c <= rightCol; c++) {
          if (c < 0 || c >= LEVEL_COLS) continue;
          if (isSolidTile(tileGrid[r][c])) {
            if (entity.vx > 0) {
              entity.x = c * TILE_SIZE - entity.w;
              entity.vx = 0;
              return true;
            } else if (entity.vx < 0) {
              entity.x = (c + 1) * TILE_SIZE;
              entity.vx = 0;
              return true;
            }
          }
        }
      }
      return false;
    }

    function resolveMapCollisionY(entity, isPlayer = false) {
      const leftCol = Math.floor(entity.x / TILE_SIZE);
      const rightCol = Math.floor((entity.x + entity.w - 0.01) / TILE_SIZE);
      const topRow = Math.floor(entity.y / TILE_SIZE);
      const bottomRow = Math.floor((entity.y + entity.h - 0.01) / TILE_SIZE);

      if (isPlayer) {
        entity.grounded = false;
      }

      for (let r = topRow; r <= bottomRow; r++) {
        if (r < 0 || r >= LEVEL_ROWS) continue;
        for (let c = leftCol; c <= rightCol; c++) {
          if (c < 0 || c >= LEVEL_COLS) continue;
          const tile = tileGrid[r][c];
          if (isSolidTile(tile)) {
            if (entity.vy > 0) {
              const wasSlamming = isPlayer && entity.poundState === 'SLAMMING';
              entity.y = r * TILE_SIZE - entity.h;
              entity.vy = 0;
              if (isPlayer) {
                entity.grounded = true;
                if (wasSlamming) {
                  executeGroundPoundImpact(entity, r);
                }
              }
              return 'BOTTOM';
            } else if (entity.vy < 0) {
              entity.y = (r + 1) * TILE_SIZE;
              entity.vy = 0;
              if (isPlayer && tile === '?') {
                triggerSupplyBox(c, r);
              }
              return 'TOP';
            }
          }
        }
      }
      return null;
    }

    // 頂撞黃色閃電補給箱：變為已使用鐵箱並彈出黃金小魚乾
    function triggerSupplyBox(col, row) {
      const box = supplyBoxes.find(b => b.col === col && b.row === row);
      if (!box || box.used) return;

      box.used = true;
      box.bumpOffset = -5;
      tileGrid[row][col] = 'U';

      score += 50;
      fishCount += 1;
      sfx.boxHit();
      spawnParticles(box.x + 8, box.y + 4, '#ffd60a', 10);
      spawnFloatingText(box.x, box.y - 10, '+50', '#ffd60a');

      // 彈出一條會跳起的黃金小魚乾視覺動畫（分數與數量已自動計入）
      fishes.push({
        x: box.x,
        y: box.y - 12,
        baseY: box.y - 16,
        vy: -2.6,
        popping: true,
        popLife: 24,
        collected: false,
        phase: 0
      });
    }

    // 執行空中蓄力重砸落地衝擊：打開腳下與鄰近地面的補給箱，並震飛附近老鼠
    function executeGroundPoundImpact(entity, groundRow) {
      entity.poundState = 'NONE';
      entity.poundTimer = 0;
      screenShake = 8;
      sfx.poundSlam();

      const impactX = entity.x + entity.w / 2;
      const impactY = entity.y + entity.h;
      spawnParticles(impactX, impactY, '#00f5d4', 12);
      spawnParticles(impactX, impactY, '#ffd60a', 10);

      // 檢查腳下左右範圍內的地上補給箱並砸開
      const centerCol = Math.floor(impactX / TILE_SIZE);
      for (let dc = -1; dc <= 1; dc++) {
        const checkCol = centerCol + dc;
        if (checkCol >= 0 && checkCol < LEVEL_COLS && groundRow >= 0 && groundRow < LEVEL_ROWS) {
          if (tileGrid[groundRow][checkCol] === '?') {
            triggerSupplyBox(checkCol, groundRow);
          }
        }
      }

      // 衝擊波消滅鄰近的偷吃老鼠
      for (const rat of rats) {
        if (!rat.alive) continue;
        const dx = Math.abs((rat.x + rat.w / 2) - impactX);
        const dy = Math.abs((rat.y + rat.h / 2) - impactY);
        if (dx <= 26 && dy <= 18) {
          rat.alive = false;
          rat.squishTimer = 18;
          score += 100;
          spawnParticles(rat.x + 7, rat.y + 7, '#ff75a0', 10);
          spawnFloatingText(rat.x, rat.y - 8, '+100', '#00f5d4');
        }
      }
    }

    // ============================================================================
    // 9. 遊戲主邏輯更新 (Fixed Timestep 60 FPS)
    // ============================================================================
    function updateGame(now) {
      frameCount++;

      // 粒子與浮動文字更新
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.14;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 0.45;
        ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      if (screenShake > 0) screenShake--;

      if (gameState !== 'PLAYING' || showRulesModal) return;

      // 120 秒倒數計時器
      if (now - lastTimerTimestamp >= 1000) {
        const elapsedSec = Math.floor((now - lastTimerTimestamp) / 1000);
        timeLeft = Math.max(0, timeLeft - elapsedSec);
        lastTimerTimestamp += elapsedSec * 1000;

        if (timeLeft === 0) {
          lives = 0;
          gameState = 'GAMEOVER';
          sfx.gameOver();
          return;
        }
      }

      // 無敵計時器
      if (player.invulnTimer > 0) player.invulnTimer--;

      // 觸發空中蓄力重砸（在空中按下 ↓ / S / 手機 ▼重砸 鍵）
      if (keys.downJustPressed) {
        keys.downJustPressed = false;
        if (!player.grounded && player.poundState === 'NONE') {
          player.poundState = 'CHARGING';
          player.poundTimer = PHYSICS.POUND_CHARGE_FRAMES;
          player.vx = 0;
          player.vy = -1.2;
          sfx.poundCharge();
          spawnParticles(player.x + 6, player.y + 8, '#ffd60a', 6);
        }
      }

      if (player.poundState === 'CHARGING') {
        player.vx = 0;
        player.vy = 0;
        player.poundTimer--;
        if (player.poundTimer <= 0) {
          player.poundState = 'SLAMMING';
          player.vy = PHYSICS.POUND_SLAM_SPEED;
        }
      } else if (player.poundState === 'SLAMMING') {
        player.vx = 0;
        player.vy = PHYSICS.POUND_SLAM_SPEED;
        if (frameCount % 2 === 0) {
          spawnParticles(player.x + 6, player.y, '#00f5d4', 1);
        }
      } else {
        // 正常水平加速度與慣性摩擦
        const accel = player.grounded ? PHYSICS.ACCEL : PHYSICS.AIR_ACCEL;
        const friction = player.grounded ? PHYSICS.FRICTION : PHYSICS.AIR_FRICTION;

        if (keys.left && !keys.right) {
          player.vx -= accel;
          player.facingRight = false;
        } else if (keys.right && !keys.left) {
          player.vx += accel;
          player.facingRight = true;
        } else {
          player.vx *= friction;
          if (Math.abs(player.vx) < 0.06) player.vx = 0;
        }

        if (player.vx > PHYSICS.MAX_SPEED_X) player.vx = PHYSICS.MAX_SPEED_X;
        if (player.vx < -PHYSICS.MAX_SPEED_X) player.vx = -PHYSICS.MAX_SPEED_X;

        // 跳躍緩衝與土狼時間
        if (keys.jumpJustPressed) {
          player.jumpBufferTimer = PHYSICS.JUMP_BUFFER_FRAMES;
          keys.jumpJustPressed = false;
        } else if (player.jumpBufferTimer > 0) {
          player.jumpBufferTimer--;
        }

        if (player.grounded) {
          player.coyoteTimer = PHYSICS.COYOTE_FRAMES;
        } else if (player.coyoteTimer > 0) {
          player.coyoteTimer--;
        }

        // 執行起跳
        if (player.jumpBufferTimer > 0 && player.coyoteTimer > 0) {
          player.vy = PHYSICS.JUMP_VELOCITY;
          player.grounded = false;
          player.coyoteTimer = 0;
          player.jumpBufferTimer = 0;
          sfx.jump();
        }

        // 短按放開跳躍鍵時截斷上升速度（實現短按小跳、長按大跳）
        if (!keys.jump && player.vy < -1.5) {
          player.vy *= PHYSICS.JUMP_CUT_MULT;
        }

        // 垂直重力：上升且持續按住空白鍵時套用低重力，讓長按能跳得明顯更高
        let grav = PHYSICS.GRAVITY;
        if (player.vy > 0) {
          grav = PHYSICS.FALL_GRAVITY;
        } else if (keys.jump && player.vy < 0) {
          grav = PHYSICS.HOLD_JUMP_GRAVITY;
        }
        player.vy = Math.min(PHYSICS.MAX_FALL_SPEED, player.vy + grav);
      }

      // X 軸移動與分離式碰撞
      player.x += player.vx;
      if (player.x < 0) {
        player.x = 0;
        player.vx = 0;
      }
      if (player.x + player.w > LEVEL_COLS * TILE_SIZE) {
        player.x = LEVEL_COLS * TILE_SIZE - player.w;
        player.vx = 0;
      }
      resolveMapCollisionX(player);

      // Y 軸移動與分離式碰撞
      player.y += player.vy;
      resolveMapCollisionY(player, true);

      // 掉落深淵判定
      if (player.y > CANVAS_HEIGHT + 8) {
        damagePlayer(true);
        return;
      }

      // 貓咪跑步幀動畫
      if (player.grounded && Math.abs(player.vx) > 0.25) {
        player.animTimer += Math.abs(player.vx) * 0.18;
        if (player.animTimer >= 1) {
          player.animTimer = 0;
          player.animFrame = (player.animFrame + 1) % 2;
        }
      } else {
        player.animFrame = 0;
        player.animTimer = 0;
      }

      // 更新補給箱被頂撞後的彈跳回彈動畫
      for (const box of supplyBoxes) {
        if (box.bumpOffset < 0) {
          box.bumpOffset = Math.min(0, box.bumpOffset + 0.6);
        }
      }

      // 更新黃金小魚乾（漂浮與碰撞拾取）
      for (let i = fishes.length - 1; i >= 0; i--) {
        const f = fishes[i];
        if (f.collected) continue;

        if (f.popping) {
          f.y += f.vy;
          f.vy += 0.16;
          f.popLife--;
          if (f.popLife <= 0) {
            f.collected = true;
          }
          continue;
        }

        f.y = f.baseY + Math.sin(frameCount * 0.1 + f.phase) * 2;
        const fishBox = { x: f.x + 2, y: f.y + 3, w: 12, h: 10 };
        if (aabbOverlap(player, fishBox)) {
          f.collected = true;
          score += 50;
          fishCount += 1;
          sfx.fish();
          spawnParticles(f.x + 8, f.y + 8, '#ffd60a', 7);
          spawnFloatingText(f.x, f.y - 4, '+50', '#ffd60a');
        }
      }

      // 更新偷吃老鼠巡邏與碰撞判定
      for (const rat of rats) {
        if (!rat.alive) {
          if (rat.squishTimer > 0) rat.squishTimer--;
          continue;
        }

        rat.animTimer++;
        rat.vy = Math.min(PHYSICS.MAX_FALL_SPEED, rat.vy + PHYSICS.FALL_GRAVITY);

        // 水平巡邏與屋頂邊緣懸崖偵測（防止老鼠自己走下深淵）
        const nextX = rat.x + rat.vx;
        const probeX = rat.vx < 0 ? nextX : nextX + rat.w;
        const probeCol = Math.floor(probeX / TILE_SIZE);
        const footRow = Math.floor((rat.y + rat.h + 2) / TILE_SIZE);

        let edgeAhead = false;
        if (probeCol < 0 || probeCol >= LEVEL_COLS) {
          edgeAhead = true;
        } else if (footRow < LEVEL_ROWS && !isSolidTile(tileGrid[footRow][probeCol])) {
          edgeAhead = true;
        }

        if (edgeAhead) {
          rat.vx = -rat.vx;
        } else {
          rat.x = nextX;
          if (resolveMapCollisionX(rat)) {
            const spd = rat.speed || 0.65;
            rat.vx = (rat.x % TILE_SIZE === 0) ? spd : -spd;
          }
        }
        // 與橘貓碰撞判定：重砸/從上方踩扁 vs 側面碰撞
        if (aabbOverlap(player, rat)) {
          const playerBottom = player.y + player.h;
          const isStomping =
            player.poundState === 'SLAMMING' ||
            (player.vy > 0 && (playerBottom - player.vy) <= (rat.y + 7));

          if (isStomping) {
            rat.alive = false;
            rat.squishTimer = 18;
            if (player.poundState !== 'SLAMMING') {
              player.vy = PHYSICS.BOUNCE_VELOCITY;
              player.grounded = false;
            }
            score += 100;
            sfx.stomp();
            spawnParticles(rat.x + 7, rat.y + 7, '#ff75a0', 10);
            spawnFloatingText(rat.x, rat.y - 6, '+100', '#00f5d4');
          } else {
            damagePlayer(false);
          }
        }
      }

      // 到達終點客人與拉麵旗幟判定
      if (aabbOverlap(player, goalZone)) {
        score += timeLeft * 5;
        gameState = 'VICTORY';
        sfx.win();
        spawnParticles(goalZone.custX + 8, goalZone.custY, '#00f5d4', 18);
        spawnParticles(goalZone.flagX + 8, goalZone.flagY + 8, '#ffd60a', 18);
      }

      // 攝影機平滑跟隨（保持貓咪在畫面偏左側 38% 處，方便預判前方屋頂跳躍）
      const targetCamX = player.x - CANVAS_WIDTH * 0.38;
      const maxCamX = LEVEL_COLS * TILE_SIZE - CANVAS_WIDTH;
      cameraX += (Math.max(0, Math.min(maxCamX, targetCamX)) - cameraX) * 0.16;
    }

    function damagePlayer(fellInPit) {
      if (!fellInPit && player.invulnTimer > 0) return;

      lives -= 1;
      screenShake = 10;
      sfx.hurt();
      spawnParticles(player.x + 6, player.y + 8, '#ff595e', 14);

      if (lives <= 0) {
        lives = 0;
        gameState = 'GAMEOVER';
        sfx.gameOver();
      } else if (fellInPit) {
        respawnPlayer(false);
      } else {
        player.invulnTimer = 90;
        player.poundState = 'NONE';
        player.vy = -3.4;
        player.vx = player.facingRight ? -1.8 : 1.8;
      }
    }

    // ============================================================================
    // 10. 畫面渲染引擎 (256x240 精準像素對齊)
    // ============================================================================
    function drawBackground() {
      // 依據當前關卡切換深藍/紫夜賽博夜空色調
      const stage = STAGES[currentStageIndex];
      ctx.fillStyle = stage ? stage.skyTop : '#141836';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // 閃爍像素星星
      for (const s of stars) {
        const blink = Math.sin(frameCount * s.blinkSpeed + s.x);
        ctx.fillStyle = blink > 0.3 ? '#ffffff' : (blink > -0.4 ? '#8d99ae' : '#2b3359');
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }

      // 復古像素月亮（右上角固定遠景）
      const moonX = 204;
      const moonY = 34;
      ctx.fillStyle = '#ffd60a';
      ctx.fillRect(moonX + 4, moonY, 12, 20);
      ctx.fillRect(moonX + 2, moonY + 2, 16, 16);
      ctx.fillRect(moonX, moonY + 4, 20, 12);
      // 月球陰影咬合形成新月/滿月紋理
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(moonX + 12, moonY + 4, 4, 4);
      ctx.fillRect(moonX + 6, moonY + 12, 3, 3);

      // 遠景建築剪影（視差速度 0.15x）
      const farOffset = Math.floor(cameraX * 0.15);
      for (const b of skylineFar) {
        const bx = Math.round(b.x - (farOffset % 320));
        if (bx + b.w < 0 || bx > CANVAS_WIDTH) continue;
        const by = CANVAS_HEIGHT - b.h;
        ctx.fillStyle = '#1c2247';
        ctx.fillRect(bx, by, b.w, b.h);
        if (b.litWindow) {
          ctx.fillStyle = '#364282';
          for (let wy = by + 6; wy < CANVAS_HEIGHT - 12; wy += 10) {
            ctx.fillRect(bx + 4, wy, 3, 4);
            ctx.fillRect(bx + 13, wy, 3, 4);
          }
        }
      }

      // 中景賽博建築剪影（視差速度 0.35x）
      const nearOffset = Math.floor(cameraX * 0.35);
      for (const b of skylineNear) {
        const bx = Math.round(b.x - (nearOffset % 384));
        if (bx + b.w < 0 || bx > CANVAS_WIDTH) continue;
        const by = CANVAS_HEIGHT - b.h;
        ctx.fillStyle = '#0f1329';
        ctx.fillRect(bx, by, b.w, b.h);
        // 遠景大樓霓虹招牌小線條
        ctx.fillStyle = b.neonColor;
        ctx.fillRect(bx + 4, by + 4, b.w - 8, 2);
      }
    }

    function drawLevel() {
      const camX = Math.round(cameraX);
      const startCol = Math.max(0, Math.floor(camX / TILE_SIZE));
      const endCol = Math.min(LEVEL_COLS - 1, Math.ceil((camX + CANVAS_WIDTH) / TILE_SIZE));

      for (let r = 0; r < LEVEL_ROWS; r++) {
        for (let c = startCol; c <= endCol; c++) {
          const tile = tileGrid[r][c];
          const sx = c * TILE_SIZE - camX;
          const sy = r * TILE_SIZE;

          if (tile === '#') {
            drawSprite('roof_top', sx, sy);
          } else if (tile === 'B') {
            drawSprite('roof_body', sx, sy);
          } else if (tile === '?' || tile === 'U') {
            const box = supplyBoxes.find(b => b.col === c && b.row === r);
            const offset = box ? box.bumpOffset : 0;
            drawSprite(tile === '?' ? 'supply_box' : 'supply_box_used', sx, sy + offset);
          }
        }
      }

      // 繪製漂浮黃金小魚乾
      for (const f of fishes) {
        if (f.collected) continue;
        const sx = f.x - camX;
        if (sx < -16 || sx > CANVAS_WIDTH + 16) continue;
        drawSprite('fish_gold', sx, f.y);
      }

      // 繪製終點（揮手客人 + 發光拉麵招牌）
      const flagSx = goalZone.flagX - camX;
      const custSx = goalZone.custX - camX;
      if (flagSx > -32 && flagSx < CANVAS_WIDTH + 32) {
        drawSprite('ramen_flag', flagSx, goalZone.flagY);
        const waveSprite = Math.floor(frameCount / 16) % 2 === 0 ? 'customer1' : 'customer2';
        drawSprite(waveSprite, custSx, goalZone.custY, true);
      }

      // 繪製偷吃老鼠
      for (const rat of rats) {
        if (!rat.alive && rat.squishTimer <= 0) continue;
        const sx = rat.x - camX - 1;
        if (sx < -20 || sx > CANVAS_WIDTH + 20) continue;

        const facingRight = rat.vx > 0;
        const ratSprite = Math.floor(rat.animTimer / 10) % 2 === 0 ? 'rat_walk1' : 'rat_walk2';

        if (!rat.alive) {
          // 被踩扁的壓縮像素效果
          ctx.save();
          ctx.translate(Math.round(sx), Math.round(rat.y + 8));
          ctx.scale(1, 0.45);
          drawSprite(ratSprite, 0, 0, facingRight);
          ctx.restore();
        } else {
          drawSprite(ratSprite, sx, rat.y - 2, facingRight);
        }
      }

      // 繪製主角橘貓外送員（含空中蓄力發光與高速重砸殘影特效）
      const showCat = player.invulnTimer === 0 || Math.floor(player.invulnTimer / 4) % 2 === 0;
      if (showCat) {
        let catSprite = 'cat_idle';
        if (!player.grounded) {
          catSprite = 'cat_jump';
        } else if (Math.abs(player.vx) > 0.25) {
          catSprite = player.animFrame === 0 ? 'cat_run1' : 'cat_run2';
        }

        const drawX = Math.round(player.x + player.offsetX - camX);
        const drawY = Math.round(player.y + player.offsetY);

        if (player.poundState === 'CHARGING') {
          ctx.fillStyle = frameCount % 2 === 0 ? '#ffd60a' : '#00f5d4';
          ctx.fillRect(drawX - 1, drawY - 1, 18, 18);
        } else if (player.poundState === 'SLAMMING') {
          ctx.fillStyle = 'rgba(0, 245, 212, 0.55)';
          ctx.fillRect(drawX + 2, drawY - 8, 12, 10);
        }

        drawSprite(catSprite, drawX, drawY, !player.facingRight);
      }

      // 繪製粒子與浮動加分數字
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x - camX), Math.round(p.y), p.size, p.size);
      }
    }

    function gameLoop(now) {
      updateGame(now);

      // 1. 先將 256x240 像素舞台（夜空、屋頂、橘貓、老鼠、道具）繪製在邏輯畫布
      ctx.save();
      if (screenShake > 0) {
        const dx = Math.round((Math.random() - 0.5) * 4);
        const dy = Math.round((Math.random() - 0.5) * 4);
        ctx.translate(dx, dy);
      }

      drawBackground();
      drawLevel();
      ctx.restore();

      // 2. 將 256x240 像素舞台無損整數倍放大貼至 768x720 高清主畫布
      displayCtx.imageSmoothingEnabled = false;
      displayCtx.clearRect(0, 0, displayCanvas.width, displayCanvas.height);
      displayCtx.drawImage(
        canvas,
        0, 0, CANVAS_WIDTH, CANVAS_HEIGHT,
        0, 0, displayCanvas.width, displayCanvas.height
      );

      // 3. 在 768x720 高清主畫布上直接以原生高清像素字體繪製 HUD、規則與所有文字
      drawFloatingTexts(displayCtx);
      drawHUD(displayCtx);

      if (gameState === 'TITLE') {
        drawTitleOverlay(displayCtx);
      } else if (gameState === 'STAGE_INTRO') {
        drawStageIntroOverlay(displayCtx);
      } else if (gameState === 'GAMEOVER') {
        drawEndOverlay(displayCtx, false);
      } else if (gameState === 'VICTORY') {
        drawEndOverlay(displayCtx, true);
      }

      if (showRulesModal) {
        drawRulesModal(displayCtx);
      }

      requestAnimationFrame(gameLoop);
    }

    // ============================================================================
    // 11. 鍵盤與行動裝置輸入監聽
    // ============================================================================
    function isSpaceOrJumpKey(e) {
      return (
        e.code === 'Space' ||
        e.key === ' ' ||
        e.key === 'Spacebar' ||
        e.keyCode === 32 ||
        e.code === 'ArrowUp' ||
        e.code === 'KeyW'
      );
    }

    function isPureSpaceKey(e) {
      return e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar' || e.keyCode === 32;
    }

    function toggleRulesModal() {
      showRulesModal = !showRulesModal;
      // 清除殘留按鍵狀態避免關閉視窗後角色自動滑行
      keys.left = false;
      keys.right = false;
      keys.jump = false;
      keys.jumpJustPressed = false;
      keys.down = false;
      keys.downJustPressed = false;
      keys.ignoreJumpUntilRelease = false;
      if (!showRulesModal && gameState === 'PLAYING') {
        lastTimerTimestamp = performance.now();
      }
    }

    function triggerRestart(consumeSpaceKey = false) {
      sfx.init();
      showRulesModal = false;
      // 失敗時重置回第1關(簡單)或重玩當前關卡：若在結束畫面按R則重玩當前難度關卡
      enterStageIntro(currentStageIndex, true, consumeSpaceKey);
    }

    function cycleDifficultyStage() {
      const nextIdx = (currentStageIndex + 1) % STAGES.length;
      enterStageIntro(nextIdx, true, false);
    }

    function handleKeyDown(e) {
      const isControlKey =
        ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Enter'].includes(e.code) ||
        isPureSpaceKey(e);

      if (isControlKey) {
        e.preventDefault();
      }

      sfx.init();

      // 數字鍵 1~4 快速切換 簡單 / 中等 / 困難 / 超困難 關卡
      if (['Digit1', 'Digit2', 'Digit3', 'Digit4'].includes(e.code)) {
        const idx = parseInt(e.code.replace('Digit', ''), 10) - 1;
        showRulesModal = false;
        enterStageIntro(idx, true, false);
        return;
      }

      if (e.code === 'KeyH') {
        toggleRulesModal();
        return;
      }

      if (showRulesModal) {
        if (isPureSpaceKey(e) || e.code === 'Escape' || e.code === 'Enter') {
          toggleRulesModal();
        } else if (e.code === 'KeyR') {
          triggerRestart(false);
        }
        return;
      }

      // 標題畫面：按下空白鍵（或 Enter / 上鍵）進入劇情前導
      if (gameState === 'TITLE') {
        if (isSpaceOrJumpKey(e) || e.code === 'Enter') {
          startGameFromTitle(true);
        }
        return;
      }

      // 劇情前導畫面：按下空白鍵（或 Enter）正式開始本關
      if (gameState === 'STAGE_INTRO') {
        if ((isSpaceOrJumpKey(e) || e.code === 'Enter') && !e.repeat) {
          beginStagePlay(true);
        }
        return;
      }

      // 結束或通關畫面：支援 R 鍵重玩本關，通關後按空白鍵自動進入下一難度關卡
      if (gameState === 'GAMEOVER' || gameState === 'VICTORY') {
        if (e.code === 'KeyR') {
          triggerRestart(false);
          return;
        }
        if (isPureSpaceKey(e) && !e.repeat) {
          if (gameState === 'VICTORY' && currentStageIndex < STAGES.length - 1) {
            enterStageIntro(currentStageIndex + 1, false, true);
          } else {
            enterStageIntro(0, true, true);
          }
          return;
        }
      }

      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        keys.left = true;
      }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        keys.right = true;
      }
      if (isSpaceOrJumpKey(e)) {
        if (keys.ignoreJumpUntilRelease) return;
        if (!keys.jump && !e.repeat) {
          keys.jumpJustPressed = true;
        }
        keys.jump = true;
      }
      if (e.code === 'ArrowDown' || e.code === 'KeyS') {
        if (!keys.down && !e.repeat) {
          keys.downJustPressed = true;
        }
        keys.down = true;
      }
      if (e.code === 'KeyR') {
        triggerRestart(false);
      }
      if (e.code === 'KeyM') {
        toggleMute();
      }
    }

    function handleKeyUp(e) {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        keys.left = false;
      }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        keys.right = false;
      }
      if (isSpaceOrJumpKey(e)) {
        keys.jump = false;
        keys.ignoreJumpUntilRelease = false;
      }
      if (e.code === 'ArrowDown' || e.code === 'KeyS') {
        keys.down = false;
      }
    }

    window.addEventListener('keydown', handleKeyDown, { passive: false, capture: true });
    window.addEventListener('keyup', handleKeyUp, { capture: true });

    // 視窗失焦時清除按鍵避免卡鍵
    window.addEventListener('blur', () => {
      keys.left = false;
      keys.right = false;
      keys.jump = false;
      keys.jumpJustPressed = false;
      keys.down = false;
      keys.downJustPressed = false;
      keys.ignoreJumpUntilRelease = false;
    });

    // 點擊畫布時自動取得焦點；若在標題、劇情、規則或結束畫面點擊畫布也可直接操作（支援手機觸控點擊）
    displayCanvas.addEventListener('pointerdown', () => {
      ensureFocus();
      sfx.init();
      if (showRulesModal) {
        toggleRulesModal();
      } else if (gameState === 'TITLE') {
        startGameFromTitle(false);
      } else if (gameState === 'STAGE_INTRO') {
        beginStagePlay(false);
      } else if (gameState === 'VICTORY') {
        if (currentStageIndex < STAGES.length - 1) {
          enterStageIntro(currentStageIndex + 1, false, false);
        } else {
          enterStageIntro(0, true, false);
        }
      } else if (gameState === 'GAMEOVER') {
        triggerRestart(false);
      }
    });

    // 關卡難度切換按鈕
    const stageBtn = document.getElementById('stageBtn');
    if (stageBtn) {
      stageBtn.addEventListener('click', () => {
        sfx.init();
        cycleDifficultyStage();
        ensureFocus();
      });
    }

    // 銳利高清模式切換按鈕
    const sharpBtn = document.getElementById('sharpBtn');
    if (sharpBtn) {
      sharpBtn.addEventListener('click', () => {
        ultraSharpMode = !ultraSharpMode;
        displayCanvas.width = ultraSharpMode ? 768 : 256;
        displayCanvas.height = ultraSharpMode ? 720 : 240;
        displayCtx.imageSmoothingEnabled = false;
        sharpBtn.textContent = ultraSharpMode ? 'HD: 銳利' : 'HD: 原生';
        sharpBtn.style.color = ultraSharpMode ? '#00f5d4' : '#ffbe0b';
        ensureFocus();
      });
    }

    // 規則說明按鈕與靜音切換按鈕
    const helpBtn = document.getElementById('helpBtn');
    if (helpBtn) {
      helpBtn.addEventListener('click', () => {
        sfx.init();
        toggleRulesModal();
        ensureFocus();
      });
    }

    const muteBtn = document.getElementById('muteBtn');
    function toggleMute() {
      sfx.muted = !sfx.muted;
      if (muteBtn) {
        muteBtn.textContent = sfx.muted ? 'SFX: OFF [M]' : 'SFX: ON [M]';
        muteBtn.style.color = sfx.muted ? '#8d99ae' : '#ffbe0b';
      }
    }

    if (muteBtn) {
      muteBtn.addEventListener('click', () => {
        sfx.init();
        toggleMute();
        ensureFocus();
      });
    }

    // 一鍵在瀏覽器新視窗/新分頁開啟獨立遊戲（免存檔案，支援加到桌面主畫面）
    const openTabBtn = document.getElementById('openTabBtn');
    if (openTabBtn) {
      openTabBtn.addEventListener('click', () => {
        try {
          const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
          const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
          const blobUrl = URL.createObjectURL(blob);
          const win = window.open(blobUrl, '_blank');
          if (!win) {
            // 若瀏覽器攔截彈跳視窗，則在當前分頁直接開啟
            window.location.href = blobUrl;
          }
        } catch (err) {
          console.error('開啟獨立視窗失敗:', err);
        }
        ensureFocus();
      });
    }

    // 一鍵下載完整單機 HTML 遊戲檔案
    const downloadBtn = document.getElementById('downloadBtn');
    if (downloadBtn) {
      downloadBtn.addEventListener('click', () => {
        try {
          const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
          const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = '賽博貓咪外送員_CyberCatDelivery.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (err) {
          console.error('下載失敗:', err);
        }
        ensureFocus();
      });
    }

    // 虛擬觸控按鍵綁定（支援多點觸控同時按住移動＋長按大跳，並防呆處理滑出按鈕放開）
    function bindTouchButton(id, onDown, onUp) {
      const el = document.getElementById(id);
      if (!el) return;

      const handlePress = (e) => {
        if (e.cancelable) e.preventDefault();
        sfx.init();
        el.classList.add('pressed');
        onDown();
      };

      const handleRelease = (e) => {
        if (e && e.cancelable) e.preventDefault();
        el.classList.remove('pressed');
        if (onUp) onUp();
      };

      el.addEventListener('touchstart', handlePress, { passive: false });
      el.addEventListener('touchend', handleRelease, { passive: false });
      el.addEventListener('touchcancel', handleRelease, { passive: false });
      el.addEventListener('mousedown', handlePress);
      el.addEventListener('mouseup', handleRelease);
      el.addEventListener('mouseleave', handleRelease);
    }

    bindTouchButton('btnLeft', () => { if (!showRulesModal) keys.left = true; }, () => { keys.left = false; });
    bindTouchButton('btnRight', () => { if (!showRulesModal) keys.right = true; }, () => { keys.right = false; });
    bindTouchButton('btnJump', () => {
      if (showRulesModal) {
        toggleRulesModal();
        return;
      }
      if (gameState === 'TITLE') {
        startGameFromTitle(false);
        return;
      }
      if (gameState === 'STAGE_INTRO') {
        beginStagePlay(false);
        return;
      }
      if (!keys.jump) keys.jumpJustPressed = true;
      keys.jump = true;
    }, () => { keys.jump = false; });
    bindTouchButton('btnSmash', () => {
      if (showRulesModal || gameState !== 'PLAYING') return;
      if (!keys.down) keys.downJustPressed = true;
      keys.down = true;
    }, () => { keys.down = false; });
    bindTouchButton('btnStage', () => { sfx.init(); cycleDifficultyStage(); });
    bindTouchButton('btnHelp', () => { toggleRulesModal(); });
    bindTouchButton('btnRestart', () => { triggerRestart(false); });

    // ============================================================================
    // 12. 啟動遊戲引擎
    // ============================================================================
    window.onload = () => {
      preRenderSprites();
      updateStageButtonUI();
      initLevel(true);
      ensureFocus();
      requestAnimationFrame(gameLoop);
    };
  </script>

</div></body></html>
